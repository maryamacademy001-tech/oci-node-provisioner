name: OCI A1 Flex Provisioner

# Authoritative scheduler for A1 Flex capacity retry.
#
# Schedule: every 60 minutes, at minute 23 (off the top of the hour).
# GitHub documents that scheduled workflows can be delayed during periods of
# high Actions load, and the top of the hour is the most congested slot, so an
# off-peak minute is used. The long interval is the primary capacity-retry
# mechanism; bot.py performs only SHORT bounded in-run retries and then exits,
# so no runner is kept alive waiting for capacity.
#
# Runs on the repository default branch (GitHub only fires schedules there).
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  # Single group for BOTH trigger types (schedule + workflow_dispatch), so a
  # manual run and a scheduled run can never execute simultaneously.
  # cancel-in-progress: false -> an in-flight provisioning run is never killed
  # mid-launch; a colliding run waits until the current one finishes.
  group: oci-a1-flex-provisioner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install OCI SDK
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Provision OCI A1 Flex 2 OCPU / 12 GB
        env:
          PYTHONUNBUFFERED: "1"
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }}
          OCI_AVAILABILITY_DOMAINS: ${{ secrets.OCI_AVAILABILITY_DOMAINS }}
          OCI_DISPLAY_NAME: "erp-a1-flex-2ocpu-12gb"
          OCI_BOOT_VOLUME_GB: "100"
          OCI_OCPUS: "2"
          OCI_MEMORY_GB: "12"
          OCI_MAX_ATTEMPTS: "3"
          # Stay safely under timeout-minutes: 5 (300s).
          OCI_MAX_RUNTIME_SECONDS: "210"
          OCI_CAPACITY_DELAY_SECONDS: "120"
          OCI_THROTTLE_DELAY_SECONDS: "60"
          OCI_TRANSIENT_DELAY_SECONDS: "30"
          OCI_RETRY_JITTER_SECONDS: "30"
        run: python "bot.py"
