name: OCI A1 Flex Provisioner (manual diagnostic)

# This workflow is intentionally NOT scheduled. The authoritative scheduler is
# .github/workflows/main.yml (single "23 * * * *" hourly cron). Keeping this
# file's cron enabled would trigger a second provisioning run every hour
# against the same concurrency group, doubling OCI API calls for no benefit.
# Run this manually (workflow_dispatch) when you need the extended auth preflight
# (private-key parse + derived-vs-configured fingerprint match).
on:
  workflow_dispatch:

concurrency:
  group: oci-a1-flex-provisioner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install OCI SDK
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: OCI auth preflight (safe, no API call, no secret values)
        env:
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          python - <<'PY'
          import os, hashlib
          from cryptography.hazmat.primitives.serialization import (
              load_pem_private_key, Encoding, PublicFormat,
          )
          user = os.environ.get("OCI_USER_ID", "").strip()
          ten = os.environ.get("OCI_TENANCY_ID", "").strip()
          reg = os.environ.get("OCI_REGION", "").strip()
          fp = os.environ.get("OCI_FINGERPRINT", "").strip()
          raw = os.environ.get("OCI_PRIVATE_KEY", "").strip()

          print("=== OCI auth preflight (shape only; no values, no API call) ===")
          print(f"OCI_USER_ID:    len={len(user)} ocid_ok={user.startswith('ocid1.user.oc1.')}")
          print(f"OCI_TENANCY_ID: len={len(ten)} ocid_ok={ten.startswith('ocid1.tenancy.oc1.')}")
          print(f"OCI_REGION:     value={reg} present={bool(reg)}")
          print(f"OCI_FINGERPRINT: len={len(fp)} format_ok={len(fp) == 47 and len(fp.split(':')) == 20}")
          print(
              f"PRIVATE_KEY: len={len(raw)} "
              f"header_ok={raw.startswith('-----BEGIN PRIVATE KEY-----')} "
              f"footer_ok={raw.endswith('-----END PRIVATE KEY-----')} "
              f"newlines={raw.count(chr(10))} "
              f"literal_backslash_n={'\\\\n' in raw} "
              f"surrounding_ws={raw != raw.strip()}"
          )

          key_ok, derived = False, None
          try:
              key = load_pem_private_key(raw.encode(), password=None)
              key_ok = True
              der = key.public_key().public_bytes(
                  Encoding.DER, PublicFormat.SubjectPublicKeyInfo
              )
              derived = ":".join(f"{b:02x}" for b in hashlib.sha1(der).digest())
          except Exception as exc:
              print(f"PRIVATE_KEY: PARSE FAIL ({type(exc).__name__})")

          if key_ok:
              print(f"PRIVATE_KEY: parses OK ({type(key).__name__}, {key.key_size}b)")
              print(f"DERIVED_FP:   {derived}")
              print(f"CONFIG_FP:    {fp}")
              print(f"FP_MATCH:     {derived == fp}")
              if derived != fp:
                  print(
                      "ACTION REQUIRED: configured OCI_FINGERPRINT does not match this "
                      "private key. Update the GitHub OCI_FINGERPRINT secret to the "
                      "DERIVED_FP value above (OCI Console -> user -> API Keys)."
                  )
          PY

      - name: Provision OCI A1 Flex 2 OCPU / 12 GB
        env:
          PYTHONUNBUFFERED: "1"
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }}
          OCI_AVAILABILITY_DOMAINS: ${{ secrets.OCI_AVAILABILITY_DOMAINS }}
          OCI_DISPLAY_NAME: "erp-a1-flex-2ocpu-12gb"
          OCI_BOOT_VOLUME_GB: "100"
          OCI_OCPUS: "2"
          OCI_MEMORY_GB: "12"
          OCI_MAX_ATTEMPTS: "3"
          # Stay safely under timeout-minutes: 5 (300s).
          OCI_MAX_RUNTIME_SECONDS: "210"
          OCI_CAPACITY_DELAY_SECONDS: "120"
          OCI_THROTTLE_DELAY_SECONDS: "60"
          OCI_TRANSIENT_DELAY_SECONDS: "30"
          OCI_RETRY_JITTER_SECONDS: "30"
        run: python "bot.py"
